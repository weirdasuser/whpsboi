<!DOCTYPE html>
<html lang="en">

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@de75523557e46f375fc9173a9a0c0d34d8ed34f9/thats-not-my-neighbor/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="ALLOWALL">
    <title>That's not my neighbor</title>
    <link rel="stylesheet" href="style.css">
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="thats-not-my-neighbor.icon.png" />
    <link rel="apple-touch-icon" href="thats-not-my-neighbor.apple-touch-icon.png" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #loading-title {
            color: white;
            font-family: cursive;
            font-size: 42px;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        #loading-bar-bg {
            width: 400px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        #loading-mb {
            color: #aaa;
            font-family: cursive;
            font-size: 18px;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #status {
            display: none;
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <div id="loading-title">LOADING...</div>
        <div id="loading-bar-bg">
            <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-mb">0 MB / 0 MB (0%)</div>
    </div>

    <script src="main.js"></script>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>
    <noscript> Your browser does not support JavaScript. </noscript>
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="thats-not-my-neighbor.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>
    <script src="thats-not-my-neighbor.js"></script>
    <script>
        function formatSize(bytes) {
            if (bytes > 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
            if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
            if (bytes > 1024) return (bytes / 1024).toFixed(2) + " KB";
            return bytes + " B";
        }

        const totalBytes = 410934256 + 43444261;
        let loadedBytes = 0;

        function updateLoadingUI(current, total) {
            const useTotal = total > 0 ? total : totalBytes;
            const percent = useTotal > 0 ? ((current / useTotal) * 100).toFixed(1) : "0";
            document.getElementById("loading-bar-fill").style.width = percent + "%";
            document.getElementById("loading-mb").textContent =
                formatSize(current) + " / " + formatSize(useTotal) + " (" + percent + "%)";
        }

        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "ensureCrossOriginIsolationHeaders": false,
            "executable": "thats-not-my-neighbor",
            "experimentalVK": false,
            "fileSizes": {
                "thats-not-my-neighbor.pck": 410934256,
                "thats-not-my-neighbor.wasm": 43444261
            },
            "focusCanvas": true,
            "gdextensionLibs": []
        };

        const GODOT_THREADS_ENABLED = false;
        const engine = new Engine(GODOT_CONFIG);

        window.godotrunfunction = function () {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) return;
                if (mode === 'hidden') {
                    statusOverlay.remove();
                    document.getElementById('loading-overlay').remove();
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function setStatusNotice(text) {
                while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
                text.split('\n').forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }

            function displayFailureNotice(err) {
                console.error(err);
                document.getElementById('loading-overlay').remove();
                if (err instanceof Error) setStatusNotice(err.message);
                else if (typeof err === 'string') setStatusNotice(err);
                else setStatusNotice('An unknown error occurred.');
                setStatusMode('notice');
                initializing = false;
            }

            const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

            if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                    let serviceWorkerRegistrationPromise;
                    try {
                        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                    } catch (err) {
                        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                    }
                    Promise.race([
                        serviceWorkerRegistrationPromise.then((registration) => {
                            if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
                            return registration;
                        }).then(() => engine.installServiceWorker()),
                        new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
                    ]).then(() => {
                        window.location.reload();
                    }).catch((err) => {
                        console.error('Error while registering service worker:', err);
                    });
                } else {
                    const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                    displayFailureNotice(missingMsg + missing.join('\n'));
                }
            } else {
                setStatusMode('progress');
                engine.startGame({
                    'onProgress': function (current, total) {
                        loadedBytes = current;
                        updateLoadingUI(current, total);
                        if (current > 0 && total > 0) {
                            statusProgress.value = current;
                            statusProgress.max = total;
                        } else {
                            statusProgress.removeAttribute('value');
                            statusProgress.removeAttribute('max');
                        }
                    },
                }).then(() => {
                    setStatusMode('hidden');
                }, displayFailureNotice);
            }
        };
    </script>
</body>

</html>
